[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-quality-aware-fusion"
version = "0.1.0"
description = "卒中康复质量感知 EEG-fNIRS 融合研究原型"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
signals = ["mne>=1.6", "mne-nirs>=0.7", "pysnirf2>=0.7"]
train = ["torch>=2.2"]
dev = ["ruff>=0.5", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
